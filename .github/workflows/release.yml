name: Draft release

on:
  push:
    branches: [master]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # Only release when the version changed: skip if a release (draft or
      # published) already exists for this tag.
      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep -Fxq "$TAG"; then
            echo "Release $TAG already exists, skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package extension
        if: steps.check.outputs.exists == 'false'
        run: npx --yes @vscode/vsce package --no-dependencies --skip-license

      - name: Create draft release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" ./*.vsix \
            --draft \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes
